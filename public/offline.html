<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bağlantı yok | Erqan</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f9ff; --fg: #181c21; --muted: #3f4751; --accent: #006099; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1419; --fg: #dfe6f0; --muted: #bfc7d3; --accent: #99cbff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: Roboto, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button { background: var(--accent); color: var(--on-accent, #fff); border: 0; border-radius: 999px; height: 40px; padding: 0 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Bakiyeniz ve mülkleriniz güvende. Bağlantınız geri geldiğinde sayfayı yenileyin.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
